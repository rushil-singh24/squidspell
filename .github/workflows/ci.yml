name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      # Note: ml/ tests (training + data pipeline) need the heavy toolchain
      # (mediapipe / opencv / matplotlib) and are run locally, not in CI. The
      # inference core is still exercised here via the real engine in the
      # backend WebSocket tests.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm test
      - run: npm run build
